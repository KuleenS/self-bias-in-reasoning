[project]
name = "selfbias"
version = "0.1.0"
description = "Measuring self-bias in LLM reasoning: do models judge their own reasoning chains as correct more often than others do?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kuleen Sasse" }]

# Core dependencies — analysis + API inference. No GPU required.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "datasets>=2.18",
    "huggingface-hub>=0.23",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "vllm==0.11.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
selfbias = "selfbias.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfbias"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
