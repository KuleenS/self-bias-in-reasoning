# Model pool for the self-bias experiment. Each model both GENERATES reasoning chains and
# EVALUATES others' chains, so the (generator == evaluator) "self" cells exist.
#
# Fields: id (backend id), backend (vllm_offline | vllm_online | openrouter), family, short
# (label for files/plots), reasoning, thinking_template (pass enable_thinking=True to the chat
# template — Qwen3/Gemma only), tensor_parallel, max_model_len, sampling (overrides family default).
#
# NOTE: API/OpenRouter slugs drift over time — verify them against https://openrouter.ai/models
# before a paid run. The open-weight ids assume HF availability on your cluster.

# ---------------- Open-weight (local vLLM) ----------------
Qwen/Qwen3-32B:
  id: Qwen/Qwen3-32B
  backend: vllm_offline
  family: qwen
  short: qwen
  reasoning: true
  thinking_template: true
  tensor_parallel: 2

deepseek-ai/DeepSeek-R1-Distill-Qwen-32B:
  id: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
  backend: vllm_offline
  family: deepseek
  short: ds
  reasoning: true
  tensor_parallel: 2

allenai/Olmo-3.1-32B-Think:
  id: allenai/Olmo-3.1-32B-Think
  backend: vllm_offline
  family: olmo
  short: olmo
  reasoning: true
  tensor_parallel: 2

microsoft/Phi-4-reasoning:
  id: microsoft/Phi-4-reasoning
  backend: vllm_offline
  family: phi
  short: phi
  reasoning: true
  tensor_parallel: 2

Qwen/QwQ-32B:
  id: Qwen/QwQ-32B
  backend: vllm_offline
  family: qwen
  short: qwq
  reasoning: true
  tensor_parallel: 2
  sampling: {temperature: 0.6, top_p: 0.95, top_k: 40, max_tokens: 32768}

google/gemma-3-27b-it:
  id: google/gemma-3-27b-it
  backend: vllm_offline
  family: gemma
  short: gemma
  reasoning: false        # non-reasoning baseline: does self-bias appear without explicit CoT?
  tensor_parallel: 2

# ---------------- Open-weight (local vLLM, single 80GB GPU) ----------------
