# Defaults for the headline cross-model experiment. Override on the CLI as needed.

pools:
  open:
    - Qwen/Qwen3-32B
    - deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    - allenai/Olmo-3.1-32B-Think
    - microsoft/Phi-4-reasoning
    - Qwen/QwQ-32B
    - google/gemma-3-27b-it
  api:
    - openai/gpt-5
    - anthropic/claude-sonnet-4
    - google/gemini-2.5-pro
    - deepseek/deepseek-r1
    - x-ai/grok-4
  mixed:
    - Qwen/Qwen3-32B
    - deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    - allenai/Olmo-3.1-32B-Think
    - microsoft/Phi-4-reasoning
    - openai/gpt-5
    - anthropic/claude-sonnet-4
    - google/gemini-2.5-pro

default_pool: mixed

datasets:
  - gsm8k
  - math500
  - aime
  - gpqa_diamond
  - mmlu_pro
  - arc_challenge
  - bbh
  - folio
  - logiqa
  - commonsense_qa

n_prompts: 200      # prompts sampled per dataset
doe_budget: 24      # generator x evaluator cells actually run per dataset (D-optimal subset)
seed: 0
