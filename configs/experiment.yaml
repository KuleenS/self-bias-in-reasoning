# Defaults for the headline cross-model experiment. Override on the CLI as needed.

pools:
  open:
    - Qwen/Qwen3-32B
    - deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    - allenai/Olmo-3.1-32B-Think
    - microsoft/Phi-4-reasoning
    - deepseek-ai/DeepSeek-R1-Distill-Qwen-14B
    - deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    - Qwen/Qwen3-14B
    - Qwen/Qwen3-8B
    - microsoft/Phi-4-reasoning-plus
    - openai/gpt-oss-20b
    - mistralai/Magistral-Small-2506
    - nvidia/Llama-3.1-Nemotron-Nano-8B-v1

default_pool: mixed

datasets:
  - gsm8k
  - math500
  - aime
  - gpqa_diamond
  - mmlu_pro
  - arc_challenge
  - bbh
  - folio
  - logiqa
  - commonsense_qa

n_prompts: 200      # prompts sampled per dataset
doe_budget: 48      # generator x evaluator cells actually run per dataset (D-optimal subset);
                    # pool has 12 models (24 params, full square 144 cells) — 48 gives ~0.94
                    # D-efficiency vs. the full square at 67% inference savings
seed: 0
